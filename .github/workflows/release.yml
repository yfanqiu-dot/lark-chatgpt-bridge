name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: node tools/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qiu-bridge-windows-x64
          path: |
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
